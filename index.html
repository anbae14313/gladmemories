<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>College Memories</title>
  <style>
    body { margin: 0; font-family: Arial; background: #111; color: #fff; text-align: center; }
    #lock { margin-top: 30vh; }
    input, button { padding: 10px; font-size: 16px; border-radius: 6px; border: none; }
    button { background: #ff9800; cursor: pointer; }
    #gallery { display: none; padding: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    .grid img, .grid video { width: 100%; border-radius: 8px; }
    #videoBox { display: none; }
  </style>
</head>
<body>

<div id="lock">
  <h2>🔒 Enter Password</h2>
  <input type="password" id="pw" placeholder="Password">
  <button onclick="check()">Open</button>
  <p id="msg"></p>
</div>

<div id="gallery">
  <h1>🎓 My College Memories</h1>
  <div class="grid" id="photos"></div>

  <div id="videoBox">
    <h2>🎬 Video Clips</h2>
    <div class="grid" id="videos"></div>
  </div>
</div>

<script>
  const PHOTOS = 7;
  const VIDEOS = 5;

  function check() {
    if (document.getElementById("pw").value === "college123") {
      document.getElementById("lock").style.display = "none";
      document.getElementById("gallery").style.display = "block";
      load();
    } else {
      document.getElementById("msg").innerText = "Wrong password ❌";
    }
  }

  function load() {
    for (let i = 1; i <= PHOTOS; i++) {
      const img = new Image();
      img.src = "photo" + i + ".jpg";
      img.onload = () => document.getElementById("photos").appendChild(img);
    }
    for (let i = 1; i <= VIDEOS; i++) {
      const v = document.createElement("video");
      v.src = "video" + i + ".mp4";
      v.controls = true;
      v.preload = "metadata";
      v.onloadedmetadata = () => {
        document.getElementById("videoBox").style.display = "block";
        document.getElementById("videos").appendChild(v);
      };
    }
  }
</script>

</body>
</html>
